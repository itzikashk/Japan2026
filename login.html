<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" content="#0B0B0D">
<title>כניסה — Japan 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Heebo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#0B0B0D;
  --surface:#111114;
  --border:rgba(255,255,255,.08);
  --text-primary:#FFFFFF;
  --text-secondary:#A1A1AA;
  --accent-magenta:#FF2D8D;
  --accent-violet:#8B5CF6;
  --accent-red:#FF3B30;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  font-family:"Inter","Heebo","Segoe UI",Arial,sans-serif;direction:rtl;
  background:
    radial-gradient(85% 55% at 88% -8%, rgba(255,45,141,.26), transparent 62%),
    radial-gradient(70% 55% at -5% 15%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(65% 45% at 50% 115%, rgba(59,130,246,.16), transparent 60%),
    linear-gradient(180deg,#0B0B0D 0%,#0F0E13 100%);
  color:var(--text-primary);
  position:relative;overflow:hidden;
}
body::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.04;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px, transparent 1px);
  background-size:22px 22px;
}
.card{
  position:relative;z-index:1;width:100%;max-width:380px;background:rgba(20,20,24,.75);border:1px solid var(--border);
  border-radius:24px;padding:36px 28px;backdrop-filter:blur(18px);text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 40px rgba(139,92,246,.10);
}
.flag{font-size:2rem;margin-bottom:8px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
p.sub{color:var(--text-secondary);font-size:.88rem;margin:0 0 26px;line-height:1.5}
input{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:14px;
  color:#fff;font-size:24px;padding:16px;text-align:center;font-family:"IBM Plex Mono",ui-monospace,monospace;
  outline:0;margin-bottom:14px;letter-spacing:.5em;direction:ltr;transition:border-color .15s,background .15s;
}
input:focus{border-color:var(--accent-magenta);background:rgba(255,255,255,.09)}
button{
  width:100%;padding:15px;border-radius:14px;border:0;
  background:linear-gradient(135deg,var(--accent-magenta),var(--accent-violet));color:#fff;
  font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;transition:filter .15s;
}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.6;cursor:default;filter:none}
.err{
  color:#FFB4AC;font-size:.83rem;min-height:1.2em;margin-top:14px;line-height:1.5;
}
.err:not(:empty){
  background:rgba(255,59,48,.14);border:1px solid rgba(255,59,48,.28);border-radius:10px;padding:9px 12px;
}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-magenta);margin-inline-start:6px;
  box-shadow:0 0 10px rgba(255,45,141,.7);vertical-align:middle}
</style>
</head>
<body>
  <div class="card">
    <div class="flag">🎌</div>
    <h1>יפן 2026<span class="dot"></span></h1>
    <p class="sub">אתר משפחתי פרטי — הזינו את קוד הכניסה</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="••••" autocomplete="current-password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus>
      <button type="submit" id="submitBtn">כניסה</button>
      <div class="err" id="errMsg"></div>
    </form>
  </div>
<script>
var form = document.getElementById("loginForm");
var input = document.getElementById("passwordInput");
var btn = document.getElementById("submitBtn");
var err = document.getElementById("errMsg");

input.addEventListener("input", function(){
  if(/^[0-9]{4}$/.test(input.value)){
    form.dispatchEvent(new Event("submit", {cancelable:true}));
  }
});

form.addEventListener("submit", function(e){
  e.preventDefault();
  var password = input.value;
  if(!password) return;
  btn.disabled = true;
  err.textContent = "";
  fetch("/api/auth", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: password})
  }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if(res.ok){
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next") || "/";
        window.location.href = next;
      } else {
        err.textContent = (res.data && res.data.error) || "שגיאה. נסו שוב.";
        btn.disabled = false;
      }
    })
    .catch(function(){
      err.textContent = "בעיית תקשורת. נסו שוב.";
      btn.disabled = false;
    });
});
</script>
</body>
</html>
