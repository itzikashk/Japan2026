<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#12141c">
<title>כניסה — Japan 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12141c; --navy-2:#1a1d29; --on-navy:#F3F1EC; --on-navy-2:#B7B7C6;
  --accent:#C6304F; --accent-soft:#F9E5EA;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:"Heebo","Segoe UI",Arial,sans-serif;direction:rtl;
  background:
    radial-gradient(90% 60% at 85% -10%, rgba(198,48,79,.35), transparent 60%),
    radial-gradient(70% 50% at 10% 110%, rgba(62,92,163,.28), transparent 60%),
    linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
  color:var(--on-navy);
}
.card{
  width:100%;max-width:380px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:26px;padding:32px 26px;backdrop-filter:blur(6px);text-align:center;
}
.flag{font-size:2rem;margin-bottom:6px}
h1{font-size:1.4rem;font-weight:800;margin:0 0 4px}
p.sub{color:var(--on-navy-2);font-size:.88rem;margin:0 0 24px}
input{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:14px;
  color:#fff;font-size:16px;padding:14px 16px;text-align:center;font-family:inherit;outline:0;margin-bottom:12px;
}
input:focus{border-color:var(--accent)}
button{
  width:100%;padding:14px;border-radius:14px;border:0;background:var(--accent);color:#fff;
  font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;
}
button:disabled{opacity:.6;cursor:default}
.err{color:#f3a7b7;font-size:.85rem;min-height:1.2em;margin-top:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="flag">🎌</div>
    <h1>יפן 2026</h1>
    <p class="sub">אתר משפחתי פרטי — הזינו את הסיסמה המשפחתית</p>
    <form id="loginForm">
      <input type="password" id="passwordInput" placeholder="סיסמה" autocomplete="current-password" autofocus>
      <button type="submit" id="submitBtn">כניסה</button>
      <div class="err" id="errMsg"></div>
    </form>
  </div>
<script>
var form = document.getElementById("loginForm");
var input = document.getElementById("passwordInput");
var btn = document.getElementById("submitBtn");
var err = document.getElementById("errMsg");

form.addEventListener("submit", function(e){
  e.preventDefault();
  var password = input.value;
  if(!password) return;
  btn.disabled = true;
  err.textContent = "";
  fetch("/api/auth", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: password})
  }).then(function(r){ return r.json().then(function(data){ return {ok:r.ok, data:data}; }); })
    .then(function(res){
      if(res.ok){
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next") || "/";
        window.location.href = next;
      } else {
        err.textContent = (res.data && res.data.error) || "שגיאה. נסו שוב.";
        btn.disabled = false;
      }
    })
    .catch(function(){
      err.textContent = "בעיית תקשורת. נסו שוב.";
      btn.disabled = false;
    });
});
</script>
</body>
</html>
